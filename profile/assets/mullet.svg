<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 120" role="img" aria-label="MULLET">
  <title>MULLET</title>
  <style>
    .ink { fill: #1F2328; }
    .word { fill: #1F2328; font: 800 66px system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 6px; }
    @media (prefers-color-scheme: dark) {
      .word { fill: #E6EDF3; }
    }
  </style>

  <!-- casing -->
  <rect x="50" y="52" width="12" height="60" rx="2" fill="#C98A2E"/>
  <rect x="62" y="56" width="80" height="52" fill="#FFB547"/>
  <rect x="68" y="56" width="4" height="52" fill="#C98A2E"/>
  <rect x="62" y="96" width="80" height="5" fill="#E09A36"/>

  <!-- mane: business in front, party in the back, streaming off like speed trails -->
  <g fill="#4CC2FF">
    <path d="M158,64 C152,54 146,48 138,44 C138,50 137,54 134,57 C128,49 121,46 112,44 C114,50 113,54 110,57 C96,50 80,52 64,48 C44,42 24,50 4,40 C20,60 44,58 64,64 C96,70 128,66 158,70 Z"/>
    <path d="M52,72 C38,64 22,76 4,68 C18,84 36,78 52,86 Z" opacity="0.75"/>
    <path d="M52,94 C40,90 26,100 12,96 C24,108 40,102 52,106 Z" opacity="0.5"/>
  </g>

  <!-- ears -->
  <path d="M146,60 C132,44 120,26 122,10 C138,18 156,38 160,58 Z" fill="#B85C1E"/>
  <path d="M156,60 C148,40 140,22 146,6 C162,16 174,40 172,60 Z" fill="#D9762E"/>
  <path d="M160,56 C155,42 150,28 151,16 C160,26 166,42 166,56 Z" fill="#8C4214"/>

  <!-- ogive / mule head -->
  <path d="M140,56 C172,52 198,62 212,76 C222,86 220,100 208,104 C200,107 192,106 186,104 C172,112 156,112 140,108 Z" fill="#D9762E"/>
  <path d="M140,56 C172,52 198,62 212,76 C198,70 176,64 140,66 Z" fill="#F0A060"/>
  <path d="M196,72 C214,76 222,92 212,103 C204,107 192,106 186,102 C184,90 186,78 196,72 Z" fill="#F2B07A"/>
  <circle class="ink" cx="174" cy="72" r="4.5"/>
  <circle cx="175.5" cy="70.5" r="1.4" fill="#FFFFFF"/>
  <path class="ink" d="M206,84 C210,82 213,86 210,90 C209,87 207,86 206,84 Z"/>
  <path d="M213,99 C206,101 199,101 194,99" fill="none" stroke="#8C4214" stroke-width="2.5" stroke-linecap="round"/>

  <text class="word" x="246" y="104">MULLET</text>
</svg>
